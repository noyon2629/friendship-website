<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Connect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --color-primary: #0058bc;
      --color-background: #f7f9fc;
      --color-surface: #ffffff;
      --color-surface-container: #eceef1;
      --color-surface-container-low: #f2f4f7;
      --color-on-surface: #191c1e;
      --color-on-surface-variant: #414754;
      --color-outline-variant: #c1c6d6;
      --font-family: 'Be Vietnam Pro', sans-serif;
      --radius-default: 0.5rem;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--color-background); color: var(--color-on-surface); display: flex; justify-content: center; min-height: 100vh; }

    .app-container { width: 100%; max-width: 500px; background: var(--color-background); min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }
    
    .top-bar { position: sticky; top: 0; z-index: 100; background: var(--color-surface); display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--color-outline-variant); }
    .brand-title { font-size: 20px; font-weight: 700; color: var(--color-primary); text-decoration: none; }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: var(--color-surface); border-top: 1px solid var(--color-outline-variant); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--color-on-surface-variant); font-size: 11px; background: none; border: none; width: 25%; cursor: pointer; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: var(--color-primary); font-weight: 700; }

    .feed-container { display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--color-surface); padding: 16px; }

    .avatar { width: 40px; height: 40px; border-radius: var(--radius-full); object-fit: cover; background: var(--color-surface-container); display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .avatar-lg { width: 90px; height: 90px; }

    .post-card { background: var(--color-surface); padding: 16px 0; margin-bottom: 8px; }
    .post-header { display: flex; align-items: center; gap: 12px; padding: 0 16px; margin-bottom: 12px; }
    .post-content { font-size: 15px; padding: 0 16px; margin-bottom: 12px; }
    .post-image { width: 100%; max-height: 400px; object-fit: cover; margin-top: 8px; }

    .btn-primary { background: var(--color-primary); color: #fff; border: none; padding: 12px 16px; border-radius: var(--radius-default); font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; margin-bottom: 8px; }
    .btn-secondary { background: var(--color-surface-container-low); color: var(--color-on-surface); border: none; padding: 8px 12px; border-radius: var(--radius-default); cursor: pointer; }
    .form-control { width: 100%; padding: 12px; border: 1px solid var(--color-outline-variant); border-radius: var(--radius-default); font-size: 15px; margin-bottom: 12px; }

    .hidden { display: none !important; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- TOP BAR -->
    <header class="top-bar">
      <a href="#" class="brand-title">Social Connect</a>
    </header>

    <!-- AUTH SECTION -->
    <div id="auth-section" class="card" style="margin: 16px; border-radius: 12px;">
      <h2 style="font-size: 20px; margin-bottom: 16px;" id="auth-title">Social Connect-এ স্বাগতম</h2>
      
      <div>
        <input type="text" id="auth-name" class="form-control" placeholder="আপনার পূর্ণ নাম (নতুন অ্যাকাউন্ট খুললে আবশ্যক)">
        <input type="email" id="auth-email" class="form-control" placeholder="ইমেইল অ্যাড্রেস">
        <input type="password" id="auth-password" class="form-control" placeholder="পাসওয়ার্ড">
        
        <button type="button" class="btn-primary" onclick="handleLogin()">লগইন করুন</button>
        <button type="button" class="btn-primary" style="background-color: #42b72a;" onclick="handleSignUp()">নতুন অ্যাকাউন্ট খুলুন (Sign Up)</button>
      </div>
    </div>

    <!-- MAIN FEED -->
    <main id="feed-section" class="feed-container hidden">
      <div class="card" style="display:flex; gap:12px; align-items:center;">
        <img id="my-avatar-small" class="avatar" src="" style="display:none;">
        <div id="my-avatar-text" class="avatar">U</div>
        <button class="btn-secondary" style="flex:1; text-align:left;" onclick="showPostModal()">আপনার মনের কথা শেয়ার করুন...</button>
      </div>

      <div id="posts-list"></div>
    </main>

    <!-- PROFILE VIEW -->
    <div id="profile-section" class="card hidden" style="text-align: center;">
      <h3 style="margin-bottom: 16px;">মাই প্রোফাইল</h3>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <img id="profile-img-preview" class="avatar avatar-lg" src="" style="display:none;">
        <div id="profile-text-preview" class="avatar avatar-lg" style="font-size: 32px;">U</div>
        
        <label for="avatar-input" class="btn-secondary" style="cursor: pointer;">
          <i class="fa-solid fa-camera"></i> প্রোফাইল ছবি পরিবর্তন করুন
        </label>
        <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadProfilePicture(event)">
        
        <h2 id="profile-user-name" style="margin-top: 8px;">User Name</h2>
      </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="post-modal" class="modal hidden">
      <div class="modal-content">
        <h3>নতুন পোস্ট লিখুন</h3>
        <textarea id="post-text" class="form-control" rows="3" placeholder="এখানে কিছু লিখুন..."></textarea>
        
        <label for="post-img-input" class="btn-secondary" style="text-align: center; cursor: pointer;">
          <i class="fa-solid fa-image" style="color:#45bd62;"></i> ছবি যুক্ত করুন
        </label>
        <input type="file" id="post-img-input" accept="image/*" class="hidden" onchange="previewPostImage(event)">
        <p id="image-selected-msg" style="font-size:12px; color:green;" class="hidden">ছবি সিলেক্ট করা হয়েছে!</p>

        <button class="btn-primary" onclick="submitPost()">পোস্ট করুন</button>
        <button class="btn-secondary" onclick="hidePostModal()">বাতিল</button>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-home" onclick="switchView('feed')">
        <i class="fa-solid fa-house"></i><span>Home</span>
      </button>
      <button class="nav-item" id="nav-profile" onclick="switchView('profile')">
        <i class="fa-solid fa-circle-user"></i><span>Profile</span>
      </button>
      <button class="nav-item" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
      </button>
    </nav>

  </div>

  <script>
    const SUPABASE_URL = 'https://fpdhozxounuxbpnioban.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwZGhvenhvdW51eGJwbmlvYmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA2NjQ0MzQsImV4cCI6MjA1NjI0MDQzNH0.2a-pB6iGvhfF6xO8kQ9kYfR6n5-s7T_vA2F8cW7bM8M';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let selectedPostImageFile = null;

    const authSection = document.getElementById('auth-section');
    const feedSection = document.getElementById('feed-section');
    const profileSection = document.getElementById('profile-section');
    const postModal = document.getElementById('post-modal');

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        showMainApp();
      }
    });

    // Login Function
    async function handleLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন!');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("লগইন ভুল হয়েছে: " + error.message);
      } else {
        currentUser = data.user;
        showMainApp();
      }
    }

    // Sign Up Function
    async function handleSignUp() {
      const name = document.getElementById('auth-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!name) return alert('নতুন অ্যাকাউন্ট খুলতে নাম অবশ্যই দিতে হবে!');
      if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন!');

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert("সাইন আপের সমস্যা: " + error.message);
      } else {
        if(data.user) {
          await supabase.from('profiles').insert([{ id: data.user.id, full_name: name }]);
          currentUser = data.user;
          showMainApp();
        } else {
          alert('অ্যাকাউন্ট তৈরি হয়েছে!');
        }
      }
    }

    async function showMainApp() {
      authSection.classList.add('hidden');
      feedSection.classList.remove('hidden');
      loadUserProfile();
      loadPosts();
    }

    async function loadUserProfile() {
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
      if (profile) {
        document.getElementById('profile-user-name').innerText = profile.full_name || 'User';
        
        if (profile.avatar_url) {
          document.getElementById('profile-img-preview').src = profile.avatar_url;
          document.getElementById('profile-img-preview').style.display = 'block';
          document.getElementById('profile-text-preview').style.display = 'none';

          document.getElementById('my-avatar-small').src = profile.avatar_url;
          document.getElementById('my-avatar-small').style.display = 'block';
          document.getElementById('my-avatar-text').style.display = 'none';
        } else {
          document.getElementById('profile-text-preview').innerText = (profile.full_name || 'U').charAt(0).toUpperCase();
          document.getElementById('my-avatar-text').innerText = (profile.full_name || 'U').charAt(0).toUpperCase();
        }
      }
    }

    async function uploadProfilePicture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileExt = file.name.split('.').pop();
      const fileName = `avatar_${currentUser.id}_${Date.now()}.${fileExt}`;

      const { data, error } = await supabase.storage.from('avatars').upload(fileName, file);
      if (error) return alert('ছবি আপলোড ব্যর্থ হয়েছে: ' + error.message);

      const { data: publicUrlData } = supabase.storage.from('avatars').getPublicUrl(fileName);
      const avatarUrl = publicUrlData.publicUrl;

      await supabase.from('profiles').update({ avatar_url: avatarUrl }).eq('id', currentUser.id);

      alert('প্রোফাইল ছবি পরিবর্তন হয়েছে!');
      loadUserProfile();
    }

    function showPostModal() { postModal.classList.remove('hidden'); }
    function hidePostModal() { postModal.classList.add('hidden'); selectedPostImageFile = null; }

    function previewPostImage(event) {
      selectedPostImageFile = event.target.files[0];
      if (selectedPostImageFile) {
        document.getElementById('image-selected-msg').classList.remove('hidden');
      }
    }

    async function submitPost() {
      const text = document.getElementById('post-text').value;
      if (!text && !selectedPostImageFile) return alert('কিছু লিখুন অথবা ছবি সিলেক্ট করুন!');

      let imageUrl = null;

      if (selectedPostImageFile) {
        const fileExt = selectedPostImageFile.name.split('.').pop();
        const fileName = `post_${Date.now()}.${fileExt}`;
        const { error } = await supabase.storage.from('avatars').upload(fileName, selectedPostImageFile);
        
        if (!error) {
          const { data } = supabase.storage.from('avatars').getPublicUrl(fileName);
          imageUrl = data.publicUrl;
        }
      }

      const { error } = await supabase.from('posts').insert([{
        user_id: currentUser.id,
        content: text,
        image_url: imageUrl
      }]);

      if (error) alert(error.message);
      else {
        document.getElementById('post-text').value = '';
        document.getElementById('image-selected-msg').classList.add('hidden');
        hidePostModal();
        loadPosts();
      }
    }

    async function loadPosts() {
      const container = document.getElementById('posts-list');
      container.innerHTML = '<p style="text-align:center; padding:20px;">পোস্ট লোড হচ্ছে...</p>';

      const { data: posts } = await supabase
        .from('posts')
        .select('*, profiles(full_name, avatar_url)')
        .order('created_at', { ascending: false });

      container.innerHTML = '';
      if (!posts) return;

      posts.forEach(post => {
        const name = post.profiles?.full_name || 'User';
        const avatar = post.profiles?.avatar_url;

        container.innerHTML += `
          <div class="post-card">
            <div class="post-header">
              ${avatar ? `<img src="${avatar}" class="avatar">` : `<div class="avatar">${name.charAt(0)}</div>`}
              <div>
                <div style="font-weight:700;">${name}</div>
                <div style="font-size:12px; color:#666;">${new Date(post.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
              </div>
            </div>
            <div class="post-content">${post.content || ''}</div>
            ${post.image_url ? `<img src="${post.image_url}" class="post-image">` : ''}
          </div>
        `;
      });
    }

    function switchView(view) {
      document.getElementById('nav-home').classList.toggle('active', view === 'feed');
      document.getElementById('nav-profile').classList.toggle('active', view === 'profile');
      
      feedSection.classList.toggle('hidden', view !== 'feed');
      profileSection.classList.toggle('hidden', view !== 'profile');
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
